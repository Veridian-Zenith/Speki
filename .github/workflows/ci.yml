# SPDX-License-Identifier: OSL-3.0
# CI for speki.
#
# speki is an AI model runtime: a freestanding inference engine, currently
# built up from the bottom (kernels -> layers -> forward pass -> a small
# model). The CI gates follow that ordering — each one protects a layer that
# has to stay correct before the layer above it can be trusted.
#
# Gates, in order of what each catches:
#
#   build        does it compile at all
#   freestanding is the binary genuinely static, with no undefined symbols
#   test         do the in-binary kernel tests pass (exit status IS the gate)
#   host-test    are the kernels numerically right against a reference
#   tidy         is contributed code clean
#   release-size does the shipping configuration stay small
#
# The freestanding and host-test jobs answer different questions and neither
# subsumes the other. The freestanding binary has no libm, so it can only
# check structural properties; the host suite checks numerical accuracy
# against an independent __float128 reference. A kernel has to satisfy both.
#
# ─── WHY THE TOOLCHAIN IS INSTALLED RATHER THAN USED AS-IS ────────────────
# ubuntu-24.04 ships clang 16, 17 and 18, and the runner team will not add
# newer ones. clang 18 is too old for this project on two counts:
#
#   - it predates the C23 `0o` octal literal prefix (added in clang 21), so it
#     rejects it:  error: invalid suffix 'o2000000' on integer constant
#   - it tops out at -std=c2x, so -std=c2y (C26) is rejected outright
#
# Every job therefore installs a current clang from apt.llvm.org via
# ./.github/actions/setup-llvm, and SPEKI_LLVM_VERSION is the single place that
# version is set.
#
# There is deliberately NO old-toolchain job. Two reasons:
#
#   - Silent degradation is how discrepancies get in. A build that passed on
#     clang 23 and quietly built something different on clang 18 is exactly how
#     the 0o problem reached CI in the first place.
#   - Old compilers carry known CVEs. Pinning CI to one is a supply-chain
#     liability, not just an inconvenience.
#
# The build REQUIRES c2y: cmake/SpekiFlags.cmake fails with an actionable
# message instead of downgrading the dialect when the compiler cannot provide
# it. SPEKI_CSTD may still be set explicitly, but a downgrade has to be asked
# for rather than fallen into.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref, so a busy branch does not queue
  # five identical builds.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build/cmake
  # The LLVM major version every job installs. See the header note.
  SPEKI_LLVM_VERSION: "23"
  # Target ISA for every CI build, set EXPLICITLY.
  #
  # Never leave this as the project default here. The default is "native", which
  # on a build machine means "whatever CPU the runner happens to be" -- and those
  # change without notice. This is not hypothetical: CI ran on an AMD EPYC 7763
  # (Zen 3) while development was on Intel Alder Lake, and a binary built for
  # alderlake died there with SIGILL.
  #
  # `nehalem` is the portable baseline: SSE4.2, POPCNT, CMPXCHG16B. It runs on
  # essentially every x86-64 made since ~2009, and CI must pass on hardware we
  # do not control.
  #
  # Not "x86-64-v2", which is the psABI spelling of the same feature level and
  # reads better. It does not exist in the apt.llvm.org build: its valid-CPU
  # list jumps straight from znver6 to plain x86-64, with no v2/v3/v4 levels.
  # Those are upstream-clang-only. Verify with:
  #   clang-23 -march=<name> -fsyntax-only -x c /dev/null
  SPEKI_ARCH_CI: "nehalem"

jobs:
  build:
    name: Build + freestanding tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.SPEKI_LLVM_VERSION }}

      - name: Configure
        run: |
          cmake -B ${{ env.BUILD_DIR }} --preset dev \
            -DCMAKE_C_COMPILER="$LLVM_BIN_DIR/clang-${{ env.SPEKI_LLVM_VERSION }}" \
            -DSPEKI_ARCH="${{ env.SPEKI_ARCH_CI }}"

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }}

      - name: Report the runner CPU
        # The binary is built for -march=alderlake. If it ever dies with an
        # illegal instruction on a runner, this is what says why -- a runner
        # CPU without one of those extensions looks identical to a code bug.
        run: |
          echo "== CPU =="
          lscpu | grep -E 'Model name|Flags' | sed 's/^/  /'
          echo ""
          echo "== required by -march=alderlake but missing here =="
          FLAGS=$(lscpu | grep -o '^Flags:.*' | cut -d: -f2-)
          for f in avx2 fma f16c bmi bmi2 adx gfni vaes pclmul; do
            case " $FLAGS " in
              *" $f "*) : ;;
              *) echo "  MISSING: $f" ;;
            esac
          done
          echo "  (nothing listed above means the runner supports all of them)"

      - name: Run kernel tests (freestanding)
        # No libc in this binary, so passing here proves the kernels work
        # without one. The exit status is the gate: crt0.c exits 1 on failure.
        #
        # 132 = 128 + 4 = SIGILL, i.e. an illegal instruction. That is either
        # a CPU missing an extension we compiled for, or a genuine #GP. Print
        # the CPU first so the two are distinguishable.
        run: |
          set +e
          ./build/speki
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::speki exited $rc ($((rc-128)) = $(kill -l $((rc-128)) 2>/dev/null))"
          fi
          exit $rc

      - name: Verify the binary is genuinely freestanding
        run: |
          set -euo pipefail
          fail=0

          # Must be statically linked: no interpreter, no dynamic loader.
          if file build/speki | grep -q 'dynamically linked'; then
            echo "FAIL: build/speki is dynamically linked"
            fail=1
          else
            echo "ok: statically linked"
          fi

          # Must have no dynamic section at all.
          if readelf -d build/speki 2>/dev/null | grep -q NEEDED; then
            echo "FAIL: build/speki has shared library dependencies:"
            readelf -d build/speki | grep NEEDED
            fail=1
          else
            echo "ok: no shared library dependencies"
          fi

          # No undefined symbols: nothing left to resolve at runtime.
          # --strip-all removes .symtab, so inspect the dynamic symbol table,
          # which survives stripping.
          if readelf --dyn-syms build/speki 2>/dev/null | grep -q ' UND '; then
            echo "FAIL: undefined symbols in build/speki:"
            readelf --dyn-syms build/speki | grep ' UND '
            fail=1
          else
            echo "ok: no undefined symbols"
          fi

          # A model runtime has no business shipping a libc-sized blob. Growth
          # past a few hundred KB means a runtime got linked in by accident.
          size=$(stat -c%s build/speki)
          echo "size: $size bytes"
          if [ "$size" -gt 1048576 ]; then
            echo "FAIL: binary unexpectedly large ($size bytes)"
            fail=1
          fi

          exit $fail

      - name: Upload binary
        # Freestanding: no interpreter needed, so it runs anywhere x86-64 does.
        uses: actions/upload-artifact@v7
        with:
          name: speki-freestanding
          path: build/speki
          if-no-files-found: error

  host-test:
    name: Kernel accuracy vs independent reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.SPEKI_LLVM_VERSION }}

      - name: Configure
        run: |
          cmake -B ${{ env.BUILD_DIR }} --preset dev \
            -DCMAKE_C_COMPILER="$LLVM_BIN_DIR/clang-${{ env.SPEKI_LLVM_VERSION }}" \
            -DSPEKI_ARCH="${{ env.SPEKI_ARCH_CI }}"

      - name: Build the host accuracy suite
        run: cmake --build ${{ env.BUILD_DIR }} --target speki_kernels_host

      - name: Check kernels against the fp128 reference
        # A real gate, not informational. This suite links no C library and its
        # reference is an independent Taylor series in __float128 with its own
        # ln(2), so it cannot agree with mathf.h by sharing a mistake.
        #
        # Accuracy here is what a transformer silently loses: every downstream
        # computation is scale-invariant, so a kernel off by 1e-6 relative does
        # not crash, it just quietly degrades the model.
        run: ./build/speki_kernels_host

      - name: Run via ctest
        run: ctest --preset dev

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.SPEKI_LLVM_VERSION }}

      - name: Configure (for compile_commands.json)
        run: |
          cmake -B ${{ env.BUILD_DIR }} --preset dev \
            -DCMAKE_C_COMPILER="$LLVM_BIN_DIR/clang-${{ env.SPEKI_LLVM_VERSION }}" \
            -DSPEKI_ARCH="${{ env.SPEKI_ARCH_CI }}"

      - name: Run clang-tidy
        # The check list and the reasoning behind it live in .clang-tidy.
        run: |
          set -euo pipefail
          fail=0
          for f in runtime/crt/*.c runtime/runtime/*.c; do
            "clang-tidy-${{ env.SPEKI_LLVM_VERSION }}" -p ${{ env.BUILD_DIR }} "$f" || fail=1
          done
          exit $fail

  release-size:
    name: Release build stays small
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.SPEKI_LLVM_VERSION }}

      - name: Configure (release)
        run: |
          cmake -B build/release --preset release \
            -DCMAKE_C_COMPILER="$LLVM_BIN_DIR/clang-${{ env.SPEKI_LLVM_VERSION }}" \
            -DSPEKI_ARCH="${{ env.SPEKI_ARCH_CI }}"

      - name: Build
        run: cmake --build build/release

      - name: Check size, stripping, and behaviour
        # The release preset is what ships, so its size is the number that
        # matters. Guards against a debug preset or a stray -g creeping in.
        run: |
          set -euo pipefail
          size=$(stat -c%s build/speki)
          echo "release size: $size bytes"
          if [ "$size" -gt 262144 ]; then
            echo "FAIL: release binary is $size bytes, expected well under 256 KB"
            exit 1
          fi
          if file build/speki | grep -qv stripped; then
            echo "FAIL: release binary is not stripped"
            exit 1
          fi
          ./build/speki